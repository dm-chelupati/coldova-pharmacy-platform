name: coldova-pharmacy-platform
metadata:
  template: coldova-pharmacy-platform@1.0.0

# Multi-service order processing platform
# Frontend → Gateway → Order, Payment, and Benefits Services → Worker
# PostgreSQL for orders/payments, hybrid SQL Server for benefits, Service Bus for async processing
# All services emit telemetry to Log Analytics + App Insights

services:
  frontend:
    project: ./frontend
    language: js
    host: containerapp

  gateway:
    project: ./gateway
    language: dotnet
    host: containerapp

  order-service:
    project: ./order-service
    language: dotnet
    host: containerapp

  payment-service:
    project: ./payment-service
    language: dotnet
    host: containerapp

  benefits-service:
    project: ./benefits-service
    language: dotnet
    host: containerapp

  worker:
    project: ./worker
    language: dotnet
    host: containerapp
